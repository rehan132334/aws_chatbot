version: '3.8'

services:
  # 1. Database Service (PostgreSQL + pgvector)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: local-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service (main.py)
  backend:
    build: .
    container_name: aws_architect_api
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Streamlit Frontend Service (app.py)
  frontend:
    build: .
    container_name: aws_architect_ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://aws_architect_api:8080
    depends_on:
      - backend

volumes:
  postgres_data: